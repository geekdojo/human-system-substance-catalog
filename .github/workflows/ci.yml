name: ci

# Read .github/workflows/README.md before editing any workflow here. This repository takes
# pull requests from forks, so CI runs code and text strangers wrote; the rules in that file
# are what keep that safe, and the `workflows` job below enforces them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow as its gate: a release cannot be cut from data
  # that does not validate.
  workflow_call:

# Empty here; each job asks for what it needs. A fork's pull request gets a read-only
# token and no secrets whatever is written below, but a push to main does not, and a
# grant nobody asked for is a grant a compromised step inherits.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          # No dependency cache. The tree is two packages, so a cache saves seconds, and
          # a cache shared between runs is a way for one run to poison another's inputs.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Validation is separated from the test run so a data error reads as a data error
      # in the job log rather than as an assertion failure buried in a test name.
      - name: Validate data (schema, marker keys, licence gate, placement rules)
        run: npm run check

      - name: Test with coverage (>= 70% required)
        run: npm test

      # release.yml's publish step runs tools/release-target-guard.sh before and
      # after `gh release create` to prove the tag is on the commit the bundle was
      # built from. Every exit status, against a throwaway git remote with
      # lightweight, annotated and nested tags. No network.
      - name: Release target guard tests
        run: bash tests/release-target-guard.test.sh

      - name: Build the bundle
        id: build
        run: |
          npm run build
          BUNDLE=$(ls dist/catalog-*.json | head -1)
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./$BUNDLE').version")" >> "$GITHUB_OUTPUT"

      - name: Verify the published sha256 matches a recomputation
        # Step outputs reach the script through env, never as `${{ }}` inside it.
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const b = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const { sha256: published, published_at, ...body } = b;
            const canon = v => Array.isArray(v) ? v.map(canon)
              : (v && typeof v === "object")
                ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])]))
                : v;
            const actual = crypto.createHash("sha256").update(JSON.stringify(canon(body))).digest("hex");
            if (actual !== published) { console.error(`sha256 mismatch\n  published ${published}\n  actual    ${actual}`); process.exit(1); }
            console.log(`sha256 verified: ${actual}`);
            console.log(`substances: ${b.substance_count}, markers: ${b.marker_keys.length}, version: ${b.version}`);
            if (b.substance_count < 120) { console.error("substance_count is below the 120 floor"); process.exit(1); }
          ' "$BUNDLE"

      - name: Assert no off-allowlist licence reached the bundle
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
        run: |
          node -e '
            const b = require("./" + process.argv[1]);
            const ALLOW = ["CC0-1.0", "CC-BY-4.0", "public-domain", "own-curation"];
            const bad = [];
            for (const s of b.substances) for (const src of s.sources)
              if (!ALLOW.includes(src.license)) bad.push(`${s.key}: ${src.id} -> ${src.license}`);
            if (bad.length) { console.error("LICENCE GATE FAILED:\n" + bad.join("\n")); process.exit(1); }
            console.log(`licence gate: OK across ${b.substances.length} substances`);
          ' "$BUNDLE"

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-${{ steps.build.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  workflows:
    # zizmor audits the workflows themselves: template injection, broad permissions,
    # unpinned actions, persisted credentials, cache poisoning. It is a check rather
    # than a review item because that class of bug is invisible in review. Its first
    # run on rasputin-app-catalog found an injection in the one file that lectured
    # about injections. Same tool, same version, same invocation as that repository.
    name: audit the workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: audit the workflows
        run: |
          pip install --quiet zizmor==1.29.0
          zizmor --format plain .github/workflows/
