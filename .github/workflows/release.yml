name: release

# Nothing in this workflow runs on a pull request. It starts on a CalVer tag push or a
# manual dispatch, and both need write access to this repository, so a fork's pull request
# cannot reach it or the `contents: write` token its publish job holds. Keep it that way:
# never add `pull_request_target`, `workflow_run` or a comment trigger here. Rules in
# .github/workflows/README.md.

on:
  push:
    tags: ['20[0-9][0-9].[0-1][0-9].[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'CalVer version to build, e.g. 2026.08.1. Defaults to the current UTC month, micro 1.'
        required: false
        type: string
      draft:
        description: 'Create the release as a draft.'
        required: false
        default: true
        type: boolean

# Empty here; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI is the gate. A release cannot be cut from data that does not validate.
  gate:
    name: ci gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: build and publish
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # `gh release create`, and nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # release notes diff against the previous tag
          # `gh` below authenticates from GH_TOKEN, so nothing needs the token left in
          # .git/config, where every later step could read it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          # No dependency cache in a job that publishes: a cache is written by other runs,
          # and whatever poisons it would ship inside the release.
          package-manager-cache: false

      - run: npm ci

      - name: Resolve version
        id: v
        # Every `${{ }}` value reaches the script through env, as data. A dispatch input is
        # typed by a person and a version string ends up in a shell, so it is also
        # validated strictly before it goes anywhere.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(node -e 'const d=new Date();console.log(`${d.getUTCFullYear()}.${String(d.getUTCMonth()+1).padStart(2,"0")}.1`)')"
          fi
          if ! printf '%s' "$VERSION" | grep -Eqx '20[0-9]{2}\.(0[1-9]|1[0-2])\.[0-9]+'; then
            echo "::error::'$VERSION' is not CalVer YYYY.MM.MICRO"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Refuse a downgrade
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          PREV="$(git tag -l '20*.*.*' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ -z "$PREV" ] || [ "$PREV" = "$VERSION" ]; then
            echo "No earlier release to compare against."; exit 0
          fi
          node -e '
            const cmp = (a, b) => { const p = s => s.split(".").map(Number);
              const [x, y] = [p(a), p(b)];
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
              return 0; };
            const [prev, next] = process.argv.slice(1);
            if (cmp(next, prev) <= 0) { console.error(`refusing downgrade: ${next} is not newer than ${prev}`); process.exit(1); }
            console.log(`${next} > ${prev}: OK`);
          ' "$PREV" "$VERSION"

      - name: Build the bundle
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node tools/build.mjs --version "$VERSION"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          PREV="$(git tag -l '20*.*.*' | grep -v "^${VERSION}$" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
          if [ -n "$PREV" ]; then
            mkdir -p /tmp/prev
            git archive "$PREV" data/substances 2>/dev/null | tar -x -C /tmp/prev || true
          fi
          node tools/release-notes.mjs \
            --version "$VERSION" \
            --previous "${PREV:-}" \
            --previous-dir /tmp/prev/data/substances \
            > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          DRAFT=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT="--draft"
          fi
          gh release create "$VERSION" \
            --title "human-system-substance-catalog $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $DRAFT \
            "dist/catalog-${VERSION}.json" \
            "dist/catalog-${VERSION}.json.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.v.outputs.version }}
          path: |
            dist/
            RELEASE_NOTES.md
          if-no-files-found: error
