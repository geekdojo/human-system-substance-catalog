name: release

# Nothing in this workflow runs on a pull request. It starts on a CalVer tag push or a
# manual dispatch, and both need write access to this repository, so a fork's pull request
# cannot reach it or the `contents: write` token its publish job holds. Keep it that way:
# never add `pull_request_target`, `workflow_run` or a comment trigger here. Rules in
# .github/workflows/README.md.

on:
  push:
    tags: ['20[0-9][0-9].[0-1][0-9].[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'CalVer version to build, e.g. 2026.08.1. Defaults to the current UTC month, micro 1.'
        required: false
        type: string
      draft:
        description: 'Create the release as a draft.'
        required: false
        default: true
        type: boolean

# Empty here; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI is the gate. A release cannot be cut from data that does not validate.
  gate:
    name: ci gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: build and publish
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # `gh release create`, and nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # release notes diff against the previous tag
          # `gh` below authenticates from GH_TOKEN, so nothing needs the token left in
          # .git/config, where every later step could read it.
          persist-credentials: false

      # The exact commit this job checked out and builds the bundle from. The
      # release tag must land HERE, not on whatever main points at when the
      # publish step runs: with no explicit target, GitHub creates a new tag
      # (or, for a draft, the tag at publication) from the default branch, so
      # a merge landing mid-run would tag a commit the bundle was never built
      # from.
      - name: Record built commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          # No dependency cache in a job that publishes: a cache is written by other runs,
          # and whatever poisons it would ship inside the release.
          package-manager-cache: false

      - run: npm ci

      - name: Resolve version
        id: v
        # Every `${{ }}` value reaches the script through env, as data. A dispatch input is
        # typed by a person and a version string ends up in a shell, so it is also
        # validated strictly before it goes anywhere.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(node -e 'const d=new Date();console.log(`${d.getUTCFullYear()}.${String(d.getUTCMonth()+1).padStart(2,"0")}.1`)')"
          fi
          if ! printf '%s' "$VERSION" | grep -Eqx '20[0-9]{2}\.(0[1-9]|1[0-2])\.[0-9]+'; then
            echo "::error::'$VERSION' is not CalVer YYYY.MM.MICRO"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Refuse a downgrade
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          PREV="$(git tag -l '20*.*.*' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          if [ -z "$PREV" ] || [ "$PREV" = "$VERSION" ]; then
            echo "No earlier release to compare against."; exit 0
          fi
          node -e '
            const cmp = (a, b) => { const p = s => s.split(".").map(Number);
              const [x, y] = [p(a), p(b)];
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
              return 0; };
            const [prev, next] = process.argv.slice(1);
            if (cmp(next, prev) <= 0) { console.error(`refusing downgrade: ${next} is not newer than ${prev}`); process.exit(1); }
            console.log(`${next} > ${prev}: OK`);
          ' "$PREV" "$VERSION"

      - name: Build the bundle
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node tools/build.mjs --version "$VERSION"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          PREV="$(git tag -l '20*.*.*' | grep -v "^${VERSION}$" | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)"
          if [ -n "$PREV" ]; then
            mkdir -p /tmp/prev
            git archive "$PREV" data/substances 2>/dev/null | tar -x -C /tmp/prev || true
          fi
          node tools/release-notes.mjs \
            --version "$VERSION" \
            --previous "${PREV:-}" \
            --previous-dir /tmp/prev/data/substances \
            > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.v.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
          # --target pins the tag to the built commit. On a tag push the tag
          # already exists and GitHub ignores it; on a dispatch it places the
          # new tag, or, for a draft, the tag GitHub creates on publication.
          TARGET_SHA: ${{ steps.src.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          DRAFT=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_DRAFT" = "true" ]; then
            DRAFT="--draft"
          fi

          # Before publishing: a tag already on ANOTHER commit would make gh
          # ignore --target and release this bundle under it. Refuse (status 1),
          # and refuse if the remote cannot be read (2). Status 0 is the
          # tag-push path (the tag is the checked-out commit); 3 means this run
          # creates the tag (or, for a draft, fixes where it will be created).
          created_tag=false
          rc=0
          ./tools/release-target-guard.sh "$REPO_URL" "$VERSION" "$TARGET_SHA" || rc=$?
          case "$rc" in
            0) ;;
            3) created_tag=true ;;
            *) echo "::error::refusing to release $VERSION: see release-target-guard above"; exit 1 ;;
          esac

          gh release create "$VERSION" \
            --target "$TARGET_SHA" \
            --title "human-system-substance-catalog $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $DRAFT \
            "dist/catalog-${VERSION}.json" \
            "dist/catalog-${VERSION}.json.sha256"

          # A draft creates no tag until it is published, and GitHub then
          # creates it on the draft's target. Prove that target is the built
          # commit; a draft aimed anywhere else is deleted (it holds no tag).
          if [ -n "$DRAFT" ] && [ "$created_tag" = true ]; then
            target="$(gh api "repos/$GH_REPO/releases?per_page=100" \
              | jq -r --arg v "$VERSION" 'map(select(.draft and .tag_name == $v)) | .[0].target_commitish // ""')"
            if [ "$target" != "$TARGET_SHA" ]; then
              echo "::error::draft $VERSION targets '$target', but this run built $TARGET_SHA; deleting the draft"
              gh release delete "$VERSION" --yes \
                || echo "::error::could not delete draft $VERSION; delete it by hand"
              exit 1
            fi
            echo "draft $VERSION targets the built commit $TARGET_SHA"
            exit 0
          fi

          # After publishing: prove the tag landed on the built commit. A tag
          # this run created on the wrong commit is deleted with its release so
          # nothing mis-tagged stays published. A tag that existed before this
          # step was pushed by a person and is never deleted. Only a proven
          # mismatch (1) deletes; an unreadable remote fails without touching
          # the release.
          rc=0
          ./tools/release-target-guard.sh "$REPO_URL" "$VERSION" "$TARGET_SHA" || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$rc" = 1 ] && [ "$created_tag" = true ]; then
              echo "::error::deleting release $VERSION and its tag: this run created them on the wrong commit"
              gh release delete "$VERSION" --cleanup-tag --yes \
                || echo "::error::could not delete release $VERSION; delete it and its tag by hand"
            fi
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.v.outputs.version }}
          path: |
            dist/
            RELEASE_NOTES.md
          if-no-files-found: error
